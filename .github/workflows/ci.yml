name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm i -f && npm install --save @revopush/react-native-code-push

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node modules
        run: npm i -f && npm install --save @revopush/react-native-code-push

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Pre-build React Native Android
        working-directory: android
        run: ./gradlew :ReactAndroid:installArchives -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon || true

      - name: Build Android Release
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7


  ios-build:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 120
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node modules
        run: npm i -f && npm install --save @revopush/react-native-code-push

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Build iOS (Debug Simulator)
        working-directory: ios
        run: |
          xcodebuild -workspace CodePush.xcworkspace \
            -scheme CodePush \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
            clean build CODE_SIGNING_ALLOWED=NO